[package]
name = "voxgrid"
version = "0.5.0"
edition = "2024"
authors = ["Sean Pace <sean.m.pace@outlook.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/maiteko/voxgrid.git"
description = "Voxel coordinate and bounding-box math with log-scaled voxel-tree addressing"
keywords = ["voxel", "octree", "coordinate", "bounding-box", "godot"]
categories = ["data-structures", "mathematics", "game-development"]

[features]
index64 = []
serde = ["dep:serde","glam/serde", "half/serde"]
bytemuck = ["dep:bytemuck","glam/bytemuck"]

[dependencies]
anyhow = "1.0.104"
assertables = "10.1.0"
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }
glam = { version = "0.29.3" }
half = { version = "2.7.1", features = ["num-traits"] }
lazy_static = "1.5.1"
num = "0.4.3"
num-traits = "0.2.19"
num_enum = "0.7.6"
serde = { version = "1.0.229", features = ["derive"], optional = true }
